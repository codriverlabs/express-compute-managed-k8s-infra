name: Build ecr-credential-provider

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s_version: ['1.35', '1.36']
    steps:
      - name: Find latest cloud-provider-aws tag for ${{ matrix.k8s_version }}
        id: cpa
        run: |
          TAG=$(curl -sf "https://api.github.com/repos/kubernetes/cloud-provider-aws/tags?per_page=100" \
            | jq -r '[.[] | select(.name | test("^v${{ matrix.k8s_version }}\\."))] | first | .name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: no cloud-provider-aws tag found for v${{ matrix.k8s_version }}.*" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using cloud-provider-aws ${TAG}"

      - name: Checkout cloud-provider-aws ${{ steps.cpa.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: kubernetes/cloud-provider-aws
          ref: ${{ steps.cpa.outputs.tag }}
          path: cloud-provider-aws

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cloud-provider-aws/go.mod
          cache-dependency-path: cloud-provider-aws/go.sum

      - name: Build for amd64 and arm64
        run: |
          for GOARCH in amd64 arm64; do
            GOARCH=${GOARCH} GOOS=linux go build \
              -C cloud-provider-aws \
              -o "${{ github.workspace }}/ecr-credential-provider-${{ matrix.k8s_version }}-linux-${GOARCH}" \
              ./cmd/ecr-credential-provider
            echo "✓ ecr-credential-provider-${{ matrix.k8s_version }}-linux-${GOARCH}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecr-credential-provider-${{ matrix.k8s_version }}
          path: ecr-credential-provider-${{ matrix.k8s_version }}-linux-*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ecr-credential-provider-*
          generate_release_notes: false
          body: |
            `ecr-credential-provider` binaries built from [kubernetes/cloud-provider-aws](https://github.com/kubernetes/cloud-provider-aws).

            | Asset | k8s version |
            |---|---|
            | `ecr-credential-provider-1.35-linux-amd64` | latest v1.35.x |
            | `ecr-credential-provider-1.35-linux-arm64` | latest v1.35.x |
            | `ecr-credential-provider-1.36-linux-amd64` | latest v1.36.x |
            | `ecr-credential-provider-1.36-linux-arm64` | latest v1.36.x |
