name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install CDK CLI
        run: npm install -g aws-cdk --quiet

      - name: Build release bundle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd infra && cdk synth --quiet && cd ..
          tar czf eks-d-xpress-infra-${VERSION}.tar.gz \
            README.md \
            setup-shared-infra.sh \
            delete-shared-infra.sh \
            infra/

      - name: Generate checksums
        run: sha256sum eks-d-xpress-infra-*.tar.gz > checksums.sha256

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            eks-d-xpress-infra-*.tar.gz
            checksums.sha256
