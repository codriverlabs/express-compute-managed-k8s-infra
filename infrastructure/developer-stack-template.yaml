AWSTemplateFormatVersion: '2010-09-09'
Description: 'Per-developer EKS-D control plane with dedicated subnets'

Parameters:
  SharedVpcStackName:
    Type: String
    Description: Name of the shared VPC CloudFormation stack
    Default: eks-d-shared-vpc

  DeveloperName:
    Type: String
    Description: Developer name for resource naming (lowercase, hyphens only)
    AllowedPattern: ^[a-z0-9-]+$

  SubnetIndex:
    Type: Number
    Description: Subnet index (0-50) - must be unique per developer
    MinValue: 0
    MaxValue: 50

  ClusterName:
    Type: String
    Description: EKS-D cluster name (optional, defaults to {DeveloperName}-eks-d)
    Default: ''

  ControlPlaneInstanceType:
    Type: String
    Default: t4a.large
    Description: EC2 instance type for control plane

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for SSH access

  SSHCidrBlock:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed for SSH access

Conditions:
  UseDefaultClusterName: !Equals [!Ref ClusterName, '']

Mappings:
  PrivateSubnetOctet:
    '0': { Value: '100' }
    '1': { Value: '101' }
    '2': { Value: '102' }
    '3': { Value: '103' }
    '4': { Value: '104' }
    '5': { Value: '105' }
    '6': { Value: '106' }
    '7': { Value: '107' }
    '8': { Value: '108' }
    '9': { Value: '109' }
    '10': { Value: '110' }
    '11': { Value: '111' }
    '12': { Value: '112' }
    '13': { Value: '113' }
    '14': { Value: '114' }
    '15': { Value: '115' }
    '16': { Value: '116' }
    '17': { Value: '117' }
    '18': { Value: '118' }
    '19': { Value: '119' }
    '20': { Value: '120' }
    '21': { Value: '121' }
    '22': { Value: '122' }
    '23': { Value: '123' }
    '24': { Value: '124' }
    '25': { Value: '125' }
    '26': { Value: '126' }
    '27': { Value: '127' }
    '28': { Value: '128' }
    '29': { Value: '129' }
    '30': { Value: '130' }
    '31': { Value: '131' }
    '32': { Value: '132' }
    '33': { Value: '133' }
    '34': { Value: '134' }
    '35': { Value: '135' }
    '36': { Value: '136' }
    '37': { Value: '137' }
    '38': { Value: '138' }
    '39': { Value: '139' }
    '40': { Value: '140' }
    '41': { Value: '141' }
    '42': { Value: '142' }
    '43': { Value: '143' }
    '44': { Value: '144' }
    '45': { Value: '145' }
    '46': { Value: '146' }
    '47': { Value: '147' }
    '48': { Value: '148' }
    '49': { Value: '149' }
    '50': { Value: '150' }

Resources:
  # Developer's Public Subnet
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${SharedVpcStackName}-VpcId'
      CidrBlock: !Sub '10.0.${SubnetIndex}.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-public-subnet'
        - Key: Developer
          Value: !Ref DeveloperName
        - Key: !Sub 'kubernetes.io/cluster/${ClusterNameValue}'
          Value: owned
        - Key: kubernetes.io/role/elb
          Value: '1'
        - Key: ManagedBy
          Value: CloudFormation
        - Key: SubnetType
          Value: Public

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId:
        Fn::ImportValue: !Sub '${SharedVpcStackName}-PublicRouteTableId'

  # Developer's Private Subnet
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${SharedVpcStackName}-VpcId'
      CidrBlock: !Sub
        - '10.0.${PrivateOctet}.0/24'
        - PrivateOctet: !FindInMap [PrivateSubnetOctet, !Ref SubnetIndex, Value]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-private-subnet'
        - Key: Developer
          Value: !Ref DeveloperName
        - Key: !Sub 'kubernetes.io/cluster/${ClusterNameValue}'
          Value: owned
        - Key: kubernetes.io/role/internal-elb
          Value: '1'
        - Key: karpenter.sh/discovery
          Value: !If [UseDefaultClusterName, !Sub '${DeveloperName}-eks-d', !Ref ClusterName]
        - Key: ManagedBy
          Value: CloudFormation
        - Key: SubnetType
          Value: Private

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId:
        Fn::ImportValue: !Sub '${SharedVpcStackName}-PrivateRouteTableId'

  # VPC Flow Logs for developer's subnets
  PublicSubnetFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: Subnet
      ResourceId: !Ref PublicSubnet
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName:
        Fn::ImportValue: !Sub '${SharedVpcStackName}-FlowLogGroupName'
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-public-subnet-flow-log'
        - Key: Developer
          Value: !Ref DeveloperName

  PrivateSubnetFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: Subnet
      ResourceId: !Ref PrivateSubnet
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName:
        Fn::ImportValue: !Sub '${SharedVpcStackName}-FlowLogGroupName'
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-private-subnet-flow-log'
        - Key: Developer
          Value: !Ref DeveloperName

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub
                  - 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroup}:*'
                  - LogGroup:
                      Fn::ImportValue: !Sub '${SharedVpcStackName}-FlowLogGroupName'

  # Security Groups
  ControlPlaneSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${DeveloperName}-control-plane-sg'
      GroupDescription: !Sub 'Security group for ${DeveloperName} EKS-D control plane'
      VpcId:
        Fn::ImportValue: !Sub '${SharedVpcStackName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6443
          ToPort: 6443
          CidrIp: 0.0.0.0/0
          Description: Kubernetes API server
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHCidrBlock
          Description: SSH access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-control-plane-sg'
        - Key: Developer
          Value: !Ref DeveloperName
        - Key: ManagedBy
          Value: CloudFormation

  ControlPlaneSecurityGroupIngressEtcd:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ControlPlaneSecurityGroup
      IpProtocol: tcp
      FromPort: 2379
      ToPort: 2380
      SourceSecurityGroupId: !Ref ControlPlaneSecurityGroup
      Description: etcd

  ControlPlaneSecurityGroupIngressKubelet:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ControlPlaneSecurityGroup
      IpProtocol: tcp
      FromPort: 10250
      ToPort: 10250
      SourceSecurityGroupId: !Ref ControlPlaneSecurityGroup
      Description: Kubelet API

  WorkerNodesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${DeveloperName}-worker-nodes-sg'
      GroupDescription: !Sub 'Security group for ${DeveloperName} worker nodes'
      VpcId:
        Fn::ImportValue: !Sub '${SharedVpcStackName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          SourceSecurityGroupId: !Ref ControlPlaneSecurityGroup
          Description: All traffic from control plane
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-worker-nodes-sg'
        - Key: Developer
          Value: !Ref DeveloperName
        - Key: karpenter.sh/discovery
          Value: !If [UseDefaultClusterName, !Sub '${DeveloperName}-eks-d', !Ref ClusterName]
        - Key: ManagedBy
          Value: CloudFormation

  WorkerNodesSecurityGroupIngressSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerNodesSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref WorkerNodesSecurityGroup
      Description: Node to node communication

  # IAM Roles
  ControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${DeveloperName}-eks-d-control-plane-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-eks-d-control-plane-role'
        - Key: Developer
          Value: !Ref DeveloperName
        - Key: ManagedBy
          Value: CloudFormation

  KarpenterControllerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${DeveloperName}-karpenter-controller-policy'
      Roles:
        - !Ref ControlPlaneRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:CreateFleet
              - ec2:CreateLaunchTemplate
              - ec2:CreateTags
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeImages
              - ec2:DescribeInstances
              - ec2:DescribeInstanceTypeOfferings
              - ec2:DescribeInstanceTypes
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSpotPriceHistory
              - ec2:DescribeSubnets
              - ec2:RunInstances
              - ec2:TerminateInstances
              - pricing:GetProducts
              - ssm:GetParameter
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:TerminateInstances
              - ec2:DeleteLaunchTemplate
            Resource: '*'
            Condition:
              StringEquals:
                ec2:ResourceTag/karpenter.sh/cluster: !If [UseDefaultClusterName, !Sub '${DeveloperName}-eks-d', !Ref ClusterName]
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt WorkerNodeRole.Arn

  WorkerNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${DeveloperName}-eks-d-worker-node-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-eks-d-worker-node-role'
        - Key: Developer
          Value: !Ref DeveloperName
        - Key: ManagedBy
          Value: CloudFormation

  ControlPlaneInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${DeveloperName}-eks-d-control-plane-profile'
      Roles:
        - !Ref ControlPlaneRole

  WorkerNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${DeveloperName}-eks-d-worker-node-profile'
      Roles:
        - !Ref WorkerNodeRole

  # Elastic IP for Control Plane
  ControlPlaneEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-control-plane-eip'
        - Key: Developer
          Value: !Ref DeveloperName
        - Key: ManagedBy
          Value: CloudFormation

  # EC2 Instance
  ControlPlaneInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}'
      InstanceType: !Ref ControlPlaneInstanceType
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref ControlPlaneSecurityGroup
      IamInstanceProfile: !Ref ControlPlaneInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 50
            Encrypted: true
        - DeviceName: /dev/sdf
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update
          apt-get install -y curl wget unzip
          
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          usermod -aG docker ubuntu
          
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install
          
          mkfs.ext4 /dev/nvme1n1
          mkdir -p /var/lib/etcd
          mount /dev/nvme1n1 /var/lib/etcd
          echo '/dev/nvme1n1 /var/lib/etcd ext4 defaults 0 2' >> /etc/fstab
          
          mkdir -p /home/ubuntu/eks-d-setup
          chown ubuntu:ubuntu /home/ubuntu/eks-d-setup
          
          cat > /home/ubuntu/cluster-info.txt << EOF
          Cluster Name: ${ClusterNameValue}
          Developer: ${DeveloperName}
          Control Plane Instance: $(curl -s http://169.254.169.254/latest/meta-data/instance-id)
          Private IP: $(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
          Public IP: $(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
          Private Subnet: ${PrivateSubnet}
          Public Subnet: ${PublicSubnet}
          EOF
          
          chown ubuntu:ubuntu /home/ubuntu/cluster-info.txt
      Tags:
        - Key: Name
          Value: !Sub '${DeveloperName}-eks-d-control-plane'
        - Key: Developer
          Value: !Ref DeveloperName
        - Key: !Sub 'kubernetes.io/cluster/${ClusterNameValue}'
          Value: owned
        - Key: ManagedBy
          Value: CloudFormation

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref ControlPlaneInstance
      EIP: !Ref ControlPlaneEIP

  ClusterNameValue:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/eks-d/${DeveloperName}/cluster-name'
      Type: String
      Value: !If [UseDefaultClusterName, !Sub '${DeveloperName}-eks-d', !Ref ClusterName]
      Tags:
        Developer: !Ref DeveloperName
        ManagedBy: CloudFormation

Outputs:
  ControlPlaneInstanceId:
    Description: ID of the control plane EC2 instance
    Value: !Ref ControlPlaneInstance
    Export:
      Name: !Sub '${AWS::StackName}-ControlPlaneInstanceId'

  ControlPlanePublicIP:
    Description: Public IP of the control plane (Elastic IP)
    Value: !Ref ControlPlaneEIP
    Export:
      Name: !Sub '${AWS::StackName}-ControlPlanePublicIP'

  ControlPlanePrivateIP:
    Description: Private IP of the control plane
    Value: !GetAtt ControlPlaneInstance.PrivateIp
    Export:
      Name: !Sub '${AWS::StackName}-ControlPlanePrivateIP'

  ClusterName:
    Description: Name of the EKS-D cluster
    Value: !If [UseDefaultClusterName, !Sub '${DeveloperName}-eks-d', !Ref ClusterName]
    Export:
      Name: !Sub '${AWS::StackName}-ClusterName'

  PublicSubnetId:
    Description: ID of developer's public subnet
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId'

  PrivateSubnetId:
    Description: ID of developer's private subnet
    Value: !Ref PrivateSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetId'

  WorkerSecurityGroupId:
    Description: ID of worker nodes security group
    Value: !Ref WorkerNodesSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-WorkerSecurityGroupId'

  WorkerNodeInstanceProfile:
    Description: Instance profile for worker nodes
    Value: !Ref WorkerNodeInstanceProfile
    Export:
      Name: !Sub '${AWS::StackName}-WorkerNodeInstanceProfile'

  SSHCommand:
    Description: SSH command to connect to control plane
    Value: !Sub 'ssh -i ~/.ssh/${KeyPairName}.pem ubuntu@${ControlPlaneEIP}'

  KubeconfigEndpoint:
    Description: Kubernetes API endpoint
    Value: !Sub 'https://${ControlPlaneEIP}:6443'

  DeveloperName:
    Description: Developer name
    Value: !Ref DeveloperName

  SubnetIndex:
    Description: Subnet index used
    Value: !Ref SubnetIndex
