# Cluster identity
clusterName: ""
developerSignum: ""
awsRegion: "us-east-1"

# EKS-Optimized AL2023 AMI for arm64 + k8s 1.35
# Discovered at runtime via SSM: /aws/service/eks/optimized-ami/1.35/amazon-linux-2023/arm64/standard/recommended/image_id
amiId: ""

# Discovered at runtime by configure-nodepools.sh
instanceProfile: ""
subnetId: ""
securityGroupId: ""

# NodeConfig for nodeadm (AL2023 EKS-Optimized worker nodes)
nodeConfig:
  apiServerEndpoint: ""
  certificateAuthority: ""
  serviceCidr: "10.96.0.0/12"

# NodePool settings
nodePool:
  capacityType: "spot"
  arch: "arm64"
  instanceCategories: ["m", "c", "r"]
  instanceGenerationGt: "5"
  cpuLimit: "100"
  memoryLimit: "100Gi"
  consolidateAfter: "1m"
