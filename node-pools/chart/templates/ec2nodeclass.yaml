apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  instanceProfile: {{ .Values.instanceProfile | quote }}

  amiSelectorTerms:
    - id: {{ .Values.amiId | quote }}

  subnetSelectorTerms:
    - id: {{ .Values.subnetId | quote }}

  securityGroupSelectorTerms:
    - id: {{ .Values.securityGroupId | quote }}

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    ---
    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      cluster:
        name: {{ .Values.clusterName }}
        apiServerEndpoint: {{ .Values.nodeConfig.apiServerEndpoint }}
        certificateAuthority: {{ .Values.nodeConfig.certificateAuthority }}
        cidr: {{ .Values.nodeConfig.serviceCidr }}
      kubelet:
        flags:
          - "--node-labels=karpenter.sh/nodepool=default"

    --//--

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Developer: {{ .Values.developerSignum | quote }}
    "kubernetes.io/cluster/{{ .Values.clusterName }}": "owned"
    ManagedBy: Karpenter
