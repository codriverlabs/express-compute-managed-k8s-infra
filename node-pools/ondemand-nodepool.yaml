apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: ondemand-nodepool
spec:
  # Template for nodes
  template:
    metadata:
      labels:
        node-type: "ondemand"
        provisioner: "karpenter"
    spec:
      # Instance requirements
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3.large", "m5.large", "m5.xlarge"]
      
      # Node class reference
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: ondemand-nodeclass

  # Scaling limits (smaller for on-demand)
  limits:
    cpu: 100
    memory: 100Gi

  # Disruption settings
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
    expireAfter: 720h # 30 days

---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: ondemand-nodeclass
spec:
  # AMI selection
  amiFamily: AL2
  
  # Instance profile (from Terraform)
  instanceProfile: "REPLACE_WITH_INSTANCE_PROFILE_NAME"
  
  # Subnets (from Terraform - will be auto-discovered by tags)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "REPLACE_WITH_CLUSTER_NAME"
  
  # Security groups (from Terraform - will be auto-discovered by tags)
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "REPLACE_WITH_CLUSTER_NAME"
  
  # User data for worker nodes
  userData: |
    #!/bin/bash
    /etc/eks/bootstrap.sh REPLACE_WITH_CLUSTER_NAME
    
    # Install additional tools
    yum update -y
    yum install -y htop
  
  # Block device mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  # Instance metadata options
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  # Tags for instances
  tags:
    Name: "karpenter-ondemand-node"
    Environment: "development"
    ManagedBy: "karpenter"
    "ebs.csi.aws.com/cluster-name": "REPLACE_WITH_CLUSTER_NAME"
